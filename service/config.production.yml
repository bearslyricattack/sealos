# Production Sealos Monitoring Service Configuration
# Optimized for high-performance production workloads

# ============================================================================
# Server Configuration
# ============================================================================
addr: ":8080"
logLevel: "info"
enablePprof: false
readTimeoutSeconds: 30
writeTimeoutSeconds: 30

# ============================================================================
# Metrics Configuration
# ============================================================================
metricsHost: "http://victoria-metrics:8428"

metrics:
  # Optimized for high throughput
  timeoutSeconds: 30
  dialTimeoutSeconds: 15
  tlsHandshakeTimeoutSeconds: 10
  expectContinueTimeoutSeconds: 1

  # Aggressive connection pooling for production
  maxIdleConns: 200              # Support ~2000 req/s
  maxIdleConnsPerHost: 50        # Multiple connections to metrics host
  maxConnsPerHost: 0             # No limit on connections
  idleConnTimeoutSeconds: 90
  keepAliveSeconds: 30

  # Performance optimizations
  disableCompression: true       # Save CPU cycles
  disableKeepAlives: false       # Enable keep-alive for reuse

# ============================================================================
# Kubernetes Configuration
# ============================================================================
kubernetes:
  cacheTTLMinutes: 10            # Longer cache for production stability

# ============================================================================
# Service-Specific Configuration
# ============================================================================
minio:
  instance: "object-storage.objectstorage-system.svc.cluster.local:80"

# ============================================================================
# Performance Optimization
# ============================================================================
performance:
  # Enable caching for frequently accessed data
  enableResponseCache: true
  responseCacheTTLSeconds: 60
  responseCacheMaxSize: 5000     # Larger cache for production

  # Enable query caching for repeated queries
  enableQueryCache: true
  queryCacheTTLSeconds: 300

  # Larger buffers for better throughput
  readBufferSize: 8192
  writeBufferSize: 8192

# ============================================================================
# Production Notes
# ============================================================================
#
# This configuration is optimized for:
# - High throughput (2000+ req/s)
# - Low latency (<50ms p99)
# - Efficient resource usage
# - Production stability
#
# Resource Requirements:
# - Memory: ~500MB baseline + 50KB per idle connection
#   With 200 idle conns: ~500MB + 10MB = ~510MB
# - CPU: 0.5-1.0 cores under normal load
#
# Scaling Guidelines:
# - For >5000 req/s: Increase maxIdleConns to 500+
# - For >10000 req/s: Deploy multiple instances with load balancer
# - Monitor connection pool saturation via metrics
#
