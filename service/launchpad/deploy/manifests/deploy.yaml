apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: launchpad-monitor
  name: launchpad-monitor-config
  namespace: monitor-service
data:
  config.yml: |
    # Launchpad Monitor Service Configuration
    addr: ":8428"
    logLevel: "info"

    # Victoria Metrics endpoint (set via environment variable VM_SERVICE_HOST)
    # metricsHost will be read from METRICS_HOST env var

    # Production-optimized connection pool
    metrics:
      maxIdleConns: 100
      maxIdleConnsPerHost: 20
      idleConnTimeoutSeconds: 90
      keepAliveSeconds: 30
      disableCompression: true

    # Kubernetes authentication cache
    kubernetes:
      cacheTTLMinutes: 5

    # Performance tuning
    performance:
      readBufferSize: 4096
      writeBufferSize: 4096
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: launchpad-monitor
  name: launchpad-monitor-deployment
  namespace: monitor-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: launchpad-monitor
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: launchpad-monitor
    spec:
      containers:
        - args:
            - /config/config.yml
          command:
            - /manager
          env:
            - name: METRICS_HOST
              value: http://vmselect-vm-stack-victoria-metrics-k8s-stack.vm.svc:8481
            - name: WHITELIST_KUBERNETES_HOSTS
              value: https://gzg.sealos.run:6443
          image: bearslyricattack/sealos-launchpad-service:v2-1
          imagePullPolicy: Always
          name: launchpad-monitor
          ports:
            - containerPort: 8428
              protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 5m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /config
              name: config-vol
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      volumes:
        - configMap:
            defaultMode: 420
            name: launchpad-monitor-config
          name: config-vol
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: launchpad-monitor
  name: launchpad-monitor
  namespace: monitor-service
spec:
  ports:
    - name: http
      port: 8428
      protocol: TCP
      targetPort: 8428
  selector:
    app: launchpad-monitor